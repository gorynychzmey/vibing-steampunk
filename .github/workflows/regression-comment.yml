name: Regression comment

# Stage 2 of two. Takes the artifact `Regression` produced and posts it as a
# single comment that is rewritten on every run.
#
# This workflow runs from the default branch, never from the pull request's
# branch — that is the whole point of the split, and it is what makes a write
# token safe here. It must therefore never check out, build, or execute
# anything from the head of the pull request. It reads one text file and posts
# it. Keep it that way.
on:
  workflow_run:
    workflows: [Regression]
    types: [completed]

permissions:
  pull-requests: write
  # Needed to download an artifact belonging to a different workflow run.
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the report
        uses: actions/download-artifact@v4
        id: download
        # A cancelled or failed measure run uploads nothing. That is not an
        # error worth a red mark on the repository.
        continue-on-error: true
        with:
          name: regression-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the pull request number
        id: pr
        run: |
          if [ ! -s report/pr.txt ] || [ ! -s report/body.md ]; then
            echo "no report to post"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(tr -dc '0-9' < report/pr.txt)
          # Refuse anything that is not a plain number: this value came out of a
          # job that ran a contributor's code, and it is about to be used as an
          # API path segment.
          if [ -z "$number" ]; then
            echo "pr.txt did not contain a number"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Match on the heading report.sh emits. One comment per pull request,
      # rewritten — not one per push.
      - name: Find the existing comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/find-comment@v3
        id: comment
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          body-includes: Regression test results

      - name: Post or rewrite the comment
        if: steps.pr.outputs.number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-id: ${{ steps.comment.outputs.comment-id }}
          edit-mode: replace
          body-path: report/body.md
